[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "politecrawl"
version = "0.0.0"
description = "Вежливый структурный асинхронный веб-краулер (asyncio, per-domain politeness)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Komyagin" }]
keywords = ["crawler", "asyncio", "web-scraping", "robots.txt", "rate-limiting"]

# Runtime deps. httpx is chosen over aiohttp: modern async HTTP client with a
# clean sync/async API, first-class type hints (works well with mypy), HTTP/2
# support, and respx for painless test mocking. See docs/TECHNICAL_PLAN.md §Стек.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
politecrawl = "politecrawl.cli:main"

[project.urls]
Repository = "https://github.com/akomyagin/politecrawl"

[tool.hatch.build.targets.wheel]
packages = ["src/politecrawl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
